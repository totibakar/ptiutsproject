<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Selection</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="menu-container">
            <button class="menu-btn">☰</button>
            <div class="dropdown">
                <a href="index.html">Menu</a>
                <a href="external/game rules.html">Read me</a>
            </div>
        </div>
        <a href="index.html" class="logo">LOGO</a>
    </div>

    <!-- Character Selection Slider -->
    <div class="character-selection">
        <button id="prevBtn">❮</button>
        <div class="slider-container">
            <div class="slider">
                <img src="assets/test1.png" class="character">
                <img src="assets/test2.png" class="character">
                <img src="assets/test3.png" class="character">
                <img src="assets/test4.gif" class="character">
                <img src="assets/test5.png" class="character">
            </div>
        </div>
        <button id="nextBtn">❯</button>
    </div>

    <!-- Input & Start Button -->
    <div class="input-container">
        <form action="external/arena.html" method="get">
            <label for="playerName" class="input-label">What is your name?</label>
            <br>
            <input type="text" id="playerName">
            <br>
            <button id="startBtn" type="submit"><b>Start Exploring</b></button>
        </form>

    </div>

    <!-- Image background -->
    <div class="image-container">
        <img src="assets/dldspldsa.png">
    </div>

    <script src="js/index.js"></script>
</body>
</html>
