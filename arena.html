<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arena</title>
    <link rel="stylesheet" href="css/arenastyle.css">
</head>
<body>
    <div>
        <div class="top-div">
            <h1>Ucup Menjelajah Nusantara</h1>
        </div>

        <div class="main-container">
            <div class="bottom-div">
                <div class="status-row">
                    <p>Good Morning, (Player Name)!</p>
                    <p id="datetime"></p>
                    <p>Money: (money)</p>
                </div>
                <div class="status-row">
                    <p>Hunger: w%</p>
                    <p>Sleep: x%</p>
                    <p>Happiness: y%</p>
                    <p>Hygiene: z%</p>
                </div>
                <div class="locations">
                    <div id="player" class="player" draggable="true" ondragstart="startDrag(event)" ondragend="endDrag(event)"></div>
                    <button class="circle-button" style="top: 20%; left: 30%;">Home</button>
                    <button class="circle-button" style="top: 50%; left: 20%;">Beach</button>
                    <button class="circle-button" style="top: 70%; left: 50%;">Lake</button>
                    <button class="circle-button" style="top: 30%; left: 70%;">Temple</button>
                    <button class="circle-button" style="top: 60%; left: 80%;">Mountain</button>
                </div>
            </div>
            <div class="separator"></div>
            <div class="side-div">
                <div class="move-buttons">
                    <div class="horizontal-buttons">
                        <div class="button-container">
                            <button class="circle-button" onclick="movePlayer('up')">Up</button>
                        </div>
                        rrrrrr
                        <div class="button-container">
                            <button class="circle-button" onclick="movePlayer('left')">Left</button><br><br><br>
                        </div>
                        rrrrrrrr
                        <div class="button-container">
                            <button class="circle-button" onclick="movePlayer('down')">Down</button>
                        </div>
                        rrrrrr
                        <div class="button-container">
                            <button class="circle-button" onclick="movePlayer('right')">Right</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/arenascript.js"></script>
</body>
</html>
