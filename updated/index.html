<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ucup Menjelajah Nusantara</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="navbar">
        <div class="menu-container">
            <button class="menu-btn">☰</button>
            <div class="dropdown">
                <a href="index.html">Menu</a>
                <a href="external/game_rules.html">Read Me</a>
            </div>
        </div>
        <a href="index.html" class="logo">LOGO</a>
    </div>

    <div class="container">
        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div id="ui-container">
            <h3 id="location-name">You're at Home</h3>

            <div id="status-container">
                <p>Hunger: <progress id="hunger" value="50" max="100"></progress></p>
                <p>Energy: <progress id="energy" value="50" max="100"></progress></p>
                <p>Hygiene: <progress id="hygiene" value="50" max="100"></progress></p>
                <p>Happiness: <progress id="happiness" value="50" max="100"></progress></p>
                <p>Money: $<span id="money">100</span></p>
            </div>

            <button id="btn-meal">Get some meal</button>
            <button id="btn-bath">Take a bath</button>
            <button id="btn-sleep">Sleep</button>
            <button id="btn-chores">Do chores</button>
            <button id="btn-travel">Travel to another place</button>
        </div>
    </div>

    <div id="game-over">
        <p>Game Over! Your status reached zero.</p>
        <button onclick="restartGame()">Restart</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
